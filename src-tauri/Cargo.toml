[package]
name = "jobglass"
version = "0.1.0"
description = "See what runs next."
authors = ["Drew Mauldin"]
edition = "2024"
rust-version = "1.98"
license = "Apache-2.0"
repository = "https://github.com/DrewMauldin/jobglass"
build = "build.rs"

[lib]
name = "jobglass_lib"
crate-type = ["cdylib", "staticlib", "rlib"]
bench = false

[[bin]]
name = "jobglass"
path = "src/main.rs"

[[bench]]
name = "diagnostics"
harness = false

[build-dependencies]
tauri-build = { version = "=2.6.1", features = [] }

[dependencies]
chrono = { version = "=0.4.45", default-features = false, features = ["clock", "serde"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.11.0"
tauri = { version = "=2.11.1", features = [] }
thiserror = "=2.0.20"
uuid = { version = "=1.26.0", features = ["v4"] }
wait-timeout = "=0.2.1"

[target.'cfg(unix)'.dependencies]
libc = "=0.2.183"

[dev-dependencies]
proptest = "=1.11.0"
tempfile = "=3.27.0"

[dependencies.plist]
version = "=1.10.0"

[dependencies.roxmltree]
version = "=0.21.1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
