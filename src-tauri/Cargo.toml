[package]
name = "jobglass"
version = "0.1.0"
description = "See what runs next."
authors = ["Drew Mauldin"]
edition = "2024"
rust-version = "1.98"
license = "Apache-2.0"
repository = "https://github.com/DrewMauldin/jobglass"
build = "build.rs"

[lib]
name = "jobglass_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[[bin]]
name = "jobglass"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "=2.6.1", features = [] }

[dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.11.0"
tauri = { version = "=2.11.1", features = [] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
