name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  version:
    name: Verify release version
    runs-on: ubuntu-24.04
    outputs:
      source_commit: ${{ steps.source.outputs.commit }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26.7.0
      - name: Match manifests to tag
        run: node scripts/check-version.mjs "$GITHUB_REF_NAME"
      - name: Bind the annotated tag to the exact main tip
        id: source
        shell: bash
        run: |
          git fetch --force origin "refs/tags/$GITHUB_REF_NAME:refs/tags/$GITHUB_REF_NAME"
          test "$(git cat-file -t "$GITHUB_REF_NAME")" = tag
          git fetch --no-tags origin main
          tag_commit=$(git rev-parse "$GITHUB_REF_NAME^{commit}")
          test "$tag_commit" = "$(git rev-parse HEAD)"
          test "$tag_commit" = "$(git rev-parse FETCH_HEAD)"
          echo "commit=$tag_commit" >> "$GITHUB_OUTPUT"

  quality:
    name: Re-run release quality and security gates
    needs: version
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out complete source history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ needs.version.outputs.source_commit }}
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26.7.0
          cache: npm
      - name: Install Linux desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes build-essential curl file libayatana-appindicator3-dev librsvg2-dev libssl-dev libwebkit2gtk-4.1-dev libxdo-dev patchelf wget
      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install 1.98.0 --profile minimal --component clippy,llvm-tools-preview,rustfmt --no-self-update
          rustup default 1.98.0
      - name: Cache Rust builds
        uses: Swatinem/rust-cache@bc2d2e71bd35c5549942babaa51a89c586b981d1 # v2.8.1
        with:
          workspaces: src-tauri -> target
      - name: Install test and audit tools
        run: |
          npm ci
          npx playwright install --with-deps chromium
          cargo install cargo-llvm-cov --version 0.9.0 --locked
          cargo install cargo-audit --version 0.22.2 --locked
      - name: Check frontend and browser behavior
        run: |
          npm run check:task
          npm run test:coverage
          npm run coverage:changed
          npm run test:e2e
          npm run size
      - name: Check Rust quality, coverage, and performance
        run: |
          cargo fmt --check --manifest-path src-tauri/Cargo.toml
          cargo test --locked --manifest-path src-tauri/Cargo.toml --all-features
          cargo clippy --locked --manifest-path src-tauri/Cargo.toml --all-targets --all-features -- -D warnings
          cargo llvm-cov --locked --manifest-path src-tauri/Cargo.toml --all-features --fail-under-lines 80
          cargo bench --locked --manifest-path src-tauri/Cargo.toml --bench diagnostics
      - name: Audit dependencies
        run: |
          npm audit --audit-level=high
          cargo audit --file src-tauri/Cargo.lock
      - name: Scan committed history for secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Validate workflow syntax
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          go_path=$(go env GOPATH)
          "$go_path/bin/actionlint"

  build:
    name: Build ${{ matrix.name }} package
    needs: [version, quality]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-15
            bundles: dmg
            artifacts: src-tauri/target/release/bundle/dmg/*.dmg
          - name: Ubuntu
            os: ubuntu-24.04
            bundles: deb,appimage
            artifacts: |
              src-tauri/target/release/bundle/deb/*.deb
              src-tauri/target/release/bundle/appimage/*.AppImage
          - name: Windows
            os: windows-2025
            bundles: msi,nsis
            artifacts: |
              src-tauri/target/release/bundle/msi/*.msi
              src-tauri/target/release/bundle/nsis/*.exe
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ needs.version.outputs.source_commit }}
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26.7.0
          cache: npm
      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes build-essential curl file libayatana-appindicator3-dev librsvg2-dev libssl-dev libwebkit2gtk-4.1-dev libxdo-dev patchelf wget
      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install 1.98.0 --profile minimal --component clippy,rustfmt --no-self-update
          rustup default 1.98.0
      - name: Cache Rust builds
        uses: Swatinem/rust-cache@bc2d2e71bd35c5549942babaa51a89c586b981d1 # v2.8.1
        with:
          workspaces: src-tauri -> target
      - name: Install JavaScript dependencies
        run: npm ci
      - name: Recheck tagged source
        run: npm run check:task
      - name: Test tagged Rust source
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml --all-features
      - name: Lint tagged Rust source
        run: cargo clippy --locked --manifest-path src-tauri/Cargo.toml --all-targets --all-features -- -D warnings
      - name: Build unsigned package
        run: npm run tauri:build -- --bundles ${{ matrix.bundles }}
      - name: Enforce hosted launch and scan budgets on the release binary
        if: runner.os == 'macOS'
        run: scripts/measure-launch.sh --hosted src-tauri/target/release/jobglass
      - name: Upload package for release assembly
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: jobglass-${{ runner.os }}-${{ runner.arch }}
          path: ${{ matrix.artifacts }}
          if-no-files-found: error

  publish:
    name: Attest, verify, and publish
    needs: [version, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      attestations: write
      contents: write
      id-token: write
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ needs.version.outputs.source_commit }}
      - name: Revalidate the remote tag and main tip
        shell: bash
        env:
          SOURCE_COMMIT: ${{ needs.version.outputs.source_commit }}
        run: |
          git fetch --no-tags origin main
          remote_tag_commit=$(git ls-remote --tags origin "refs/tags/$GITHUB_REF_NAME^{}" | awk '{print $1}')
          test -n "$remote_tag_commit"
          test "$remote_tag_commit" = "$SOURCE_COMMIT"
          test "$(git rev-parse HEAD)" = "$SOURCE_COMMIT"
          test "$(git rev-parse FETCH_HEAD)" = "$SOURCE_COMMIT"
      - name: Download packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: jobglass-*
          path: release-input
          merge-multiple: true
      - name: Generate source and dependency SBOM
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          path: .
          format: cyclonedx-json
          output-file: release-input/jobglass-sbom.cdx.json
          syft-version: v1.51.1
          upload-artifact: false
          upload-release-assets: false
      - name: Flatten release assets
        shell: bash
        run: |
          while IFS= read -r -d '' asset; do
            target="release-input/$(basename "$asset")"
            test ! -e "$target"
            mv "$asset" "$target"
          done < <(find release-input -mindepth 2 -type f -print0)
          find release-input -mindepth 1 -type d -empty -delete
          test -z "$(find release-input -mindepth 1 -type d -print -quit)"
      - name: Generate checksums
        shell: bash
        run: |
          checksum_file=$(mktemp)
          cd release-input
          find . -maxdepth 1 -type f -printf '%f\0' | LC_ALL=C sort -z | xargs -0 --no-run-if-empty shasum -a 256 > "$checksum_file"
          mv "$checksum_file" SHA256SUMS
      - name: Generate GitHub build provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: release-input/*
      - name: Verify GitHub build provenance
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          for subject in release-input/*; do
            test -f "$subject"
            gh attestation verify "$subject" --repo "$GITHUB_REPOSITORY"
          done
      - name: Create or replace only a draft release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          assets=(release-input/*)
          test "${#assets[@]}" -gt 0
          for asset in "${assets[@]}"; do test -f "$asset"; done
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            is_draft=$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq .isDraft)
            test "$is_draft" = true || { echo "refusing to mutate published release $GITHUB_REF_NAME" >&2; exit 1; }
            while IFS= read -r asset; do
              test -z "$asset" || gh release delete-asset "$GITHUB_REF_NAME" "$asset" --yes
            done < <(gh release view "$GITHUB_REF_NAME" --json assets --jq '.assets[].name')
            gh release upload "$GITHUB_REF_NAME" "${assets[@]}"
          else
            gh release create "$GITHUB_REF_NAME" "${assets[@]}" --draft --generate-notes --title "JobGlass $GITHUB_REF_NAME" --notes "Unsigned community packages. Verify SHA256SUMS and GitHub provenance before installation; platform code signing and notarisation are not claimed."
          fi
      - name: Re-download and verify published assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          mkdir release-verify
          gh release download "$GITHUB_REF_NAME" --dir release-verify
          cd release-verify
          shasum -a 256 --check SHA256SUMS
      - name: Publish verified release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$GITHUB_REF_NAME" --draft=false --latest
