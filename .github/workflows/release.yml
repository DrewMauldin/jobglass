name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  version:
    name: Verify release version
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 26.7.0
      - name: Match manifests to tag
        run: node scripts/check-version.mjs "$GITHUB_REF_NAME"

  build:
    name: Build ${{ matrix.name }} package
    needs: version
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-15
            bundles: dmg
            artifacts: src-tauri/target/release/bundle/dmg/*.dmg
          - name: Ubuntu
            os: ubuntu-24.04
            bundles: deb,appimage
            artifacts: |
              src-tauri/target/release/bundle/deb/*.deb
              src-tauri/target/release/bundle/appimage/*.AppImage
          - name: Windows
            os: windows-2025
            bundles: msi,nsis
            artifacts: |
              src-tauri/target/release/bundle/msi/*.msi
              src-tauri/target/release/bundle/nsis/*.exe
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 26.7.0
          cache: npm
      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install 1.98.0 --profile minimal --component clippy,rustfmt --no-self-update
          rustup default 1.98.0
      - name: Cache Rust builds
        uses: Swatinem/rust-cache@bc2d2e71bd35c5549942babaa51a89c586b981d1 # v2.8.1
        with:
          workspaces: src-tauri -> target
      - name: Install JavaScript dependencies
        run: npm ci
      - name: Recheck tagged source
        run: npm run check:task
      - name: Test tagged Rust source
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml --all-features
      - name: Lint tagged Rust source
        run: cargo clippy --locked --manifest-path src-tauri/Cargo.toml --all-targets --all-features -- -D warnings
      - name: Build unsigned package
        run: npm run tauri:build -- --bundles ${{ matrix.bundles }}
      - name: Upload package for release assembly
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: jobglass-${{ runner.os }}-${{ runner.arch }}
          path: ${{ matrix.artifacts }}
          if-no-files-found: error

  publish:
    name: Attest, verify, and publish
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      attestations: write
      contents: write
      id-token: write
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Download packages
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: jobglass-*
          path: release-input
          merge-multiple: true
      - name: Generate source and dependency SBOM
        uses: anchore/sbom-action@d8a2c0130026bf585de5c176ab8f7ce62d75bf04 # v0.20.7
        with:
          path: .
          format: cyclonedx-json
          output-file: release-input/jobglass-sbom.cdx.json
          syft-version: v1.51.1
          upload-artifact: false
          upload-release-assets: false
      - name: Generate checksums
        shell: bash
        run: |
          checksum_file=$(mktemp)
          cd release-input
          find . -type f -print0 | LC_ALL=C sort -z | xargs -0 shasum -a 256 > "$checksum_file"
          mv "$checksum_file" SHA256SUMS
      - name: Generate GitHub build provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: release-input/*
      - name: Create or update draft release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" release-input/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" release-input/* --draft --generate-notes --title "JobGlass $GITHUB_REF_NAME" --notes "Unsigned community packages. Verify SHA256SUMS and GitHub provenance before installation; platform code signing and notarisation are not claimed."
          fi
      - name: Re-download and verify published assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          mkdir release-verify
          gh release download "$GITHUB_REF_NAME" --dir release-verify
          cd release-verify
          shasum -a 256 --check SHA256SUMS
      - name: Publish verified release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$GITHUB_REF_NAME" --draft=false --latest
