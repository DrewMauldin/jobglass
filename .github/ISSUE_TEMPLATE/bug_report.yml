name: Bug report
description: Report a reproducible JobGlass problem without exposing private scheduler data.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a problem. Do not attach secrets, environment values, private command arguments, tokens, or unredacted exports. Report vulnerabilities privately through the Security tab.
  - type: input
    id: version
    attributes:
      label: JobGlass version
      placeholder: v0.1.0
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - macOS
        - Linux
        - Windows
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system version and package
      placeholder: macOS 15.x, Apple silicon, DMG
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the observed and expected behaviour using sanitised values.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      placeholder: |
        1. Open …
        2. Select …
        3. Observe …
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Sanitised evidence
      description: Include non-sensitive error text or counts only. Explain any redaction.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed secrets, environment values, private arguments, tokens, usernames, and personal paths.
          required: true
        - label: This is not a security vulnerability.
          required: true
